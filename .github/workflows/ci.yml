name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.11.17"
          enable-cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: "v3.22.0"
      - name: Install locked dependencies and verified tools
        run: |
          uv sync --frozen
          make tools TOOLSET="actionlint gitleaks hadolint kubeconform trivy"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Python, infrastructure, Actions, and credential checks
        run: make lint test check-infra check-actions check-charts secret-scan
      - name: Build and smoke all image targets
        run: make check-images image-scan
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified vulnerability scanner
        run: |
          make tools TOOLSET=trivy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Scan dependency vulnerabilities and configuration
        run: make security
