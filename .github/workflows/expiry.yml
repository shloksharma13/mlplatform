name: azure-expiry
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  id-token: write
concurrency:
  group: azure-platform
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    environment: azure
    timeout-minutes: 90
    env:
      ACTION: expired
      CONFIRMATION: KILL
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_NODE_RESOURCE_GROUP: ${{ vars.AZURE_NODE_RESOURCE_GROUP }}
      TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate cleanup configuration
        run: make azure-check
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Install the pinned GitHub client
        run: |
          make tools TOOLSET=gh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Delete an expired test session and verify full removal
        env:
          GH_TOKEN: ${{ github.token }}
        run: make azure ACTION=expired
