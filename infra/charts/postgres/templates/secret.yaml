{{- if .Values.auth.createSecret }}
{{- $fullName := include "postgres.fullname" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.auth.username | quote }}
  {{ .Values.auth.secretKeys.password }}: {{ .Values.auth.password | quote }}
{{- end }}
