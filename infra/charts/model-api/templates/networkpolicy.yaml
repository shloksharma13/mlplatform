{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "model-api.fullname" . }}-default-deny
  labels:
    {{- include "model-api.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "model-api.fullname" . }}
  labels:
    {{- include "model-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "model-api.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow serving requests and metrics scraping on the service port
    - ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  egress:
    # 1. DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # 2. Upstream data services in the data namespace: Redis (6379), Postgres (5432), MLflow (5000), MinIO (9000)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 5000
        - protocol: TCP
          port: 9000
{{- end }}
