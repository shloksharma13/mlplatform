{{- if .Values.auth.createSecret }}
{{- $fullName := include "minio.fullname" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "minio.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.secretKeys.accessKey }}: {{ .Values.auth.rootUser | quote }}
  {{ .Values.auth.secretKeys.secretKey }}: {{ .Values.auth.rootPassword | quote }}
{{- end }}
