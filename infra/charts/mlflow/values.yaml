replicaCount: 1

image:
  repository: localhost:5001/mlflow
  tag: dev
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 5000
  nodePort: 30500

backend:
  # postgresql://<user>:<pass>@postgres.data.svc:5432/mlflow
  host: postgres.data.svc
  port: 5432
  database: mlflow
  secretName: postgres-auth
  secretKeys:
    user: username
    password: postgres-password

artifacts:
  bucket: mlflow-artifacts
  endpoint: http://minio.data.svc:9000
  secretName: minio-auth
  secretKeys:
    accessKey: root-user
    secretKey: root-password

resources:
  requests:
    cpu: 200m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 4Gi
