# P5.2 — Loki values (chart 7.3.0).
# SingleBinary, filesystem storage, no auth, 1 replica, small PVC.

deploymentMode: SingleBinary

# SingleBinary mode requires the scalable targets to be zero.
backend: {replicas: 0}
read: {replicas: 0}
write: {replicas: 0}

loki:
  auth_enabled: false
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: {prefix: index_, period: 24h}
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  limits_config:
    retention_period: 48h

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 1Gi}
