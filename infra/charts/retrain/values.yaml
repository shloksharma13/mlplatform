# Namespace where retrain Jobs run (and where the template/SA live).
jobsNamespace: data

image:
  repository: localhost:5001/retrain
  tag: dev
  # Always: the local registry tag is reused across builds.
  pullPolicy: Always

# Release namespaces the retrain Job may roll (demo-scoped; see P8 DECISIONS).
releaseNamespaces:
  - serving
  - staging

env:
  PUBLIC_IP_NAME: ""
  AZURE_RESOURCE_GROUP: ""
  AZURE_ALLOWED_CIDR: ""
  MLFLOW_TRACKING_URI: http://mlflow.data.svc:5000
  FEAST_S3_ENDPOINT_URL: http://minio.data.svc:9000
  TRIGGER_MODE: local
  DEPLOY_TARGET: local
  MODEL_API_REPOSITORY: localhost:5001/model-api
  TRAINING_IMAGE: localhost:5001/training:dev
  IMAGE_TAG: dev
  # In-cluster service URLs for the release scripts (host NodePorts outside).
  STAGING_URL: http://model-api-staging.staging.svc:8080
  PROD_URL: http://model-api.serving.svc:8080
  STAGING_SMOKE_URL: http://model-api-staging.staging.svc:8080
  PROD_SMOKE_URL: http://model-api.serving.svc:8080

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 1900m
    memory: 3Gi
