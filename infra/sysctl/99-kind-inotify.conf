# Kernel limits required by kind's multi-node clusters (BLOCKERS.md BLK-002/BLK-004).
#
# Each kind node container runs its own kubelet, containerd and cAdvisor, and
# every one of them opens inotify instances. The kernel default of 128 is only
# enough for a single node; a 3-node cluster exhausts it and then kubelet fails
# with "inotify_init: too many open files" and kube-proxy fails with
# "fsnotify watcher init: too many open files". When kube-proxy dies, CoreDNS
# cannot reach the API server VIP (10.96.0.1) and every in-cluster DNS lookup
# breaks, which takes down all podified services (MLflow, Feast, ...).
#
# Install once (requires root) so the limits survive reboots:
#   sudo install -m 0644 infra/sysctl/99-kind-inotify.conf /etc/sysctl.d/99-kind-inotify.conf
#   sudo sysctl --system
#
# `make preflight` (also wired into `make up`) fails
# loudly when either value is below the required floor.
fs.inotify.max_user_instances = 512
fs.inotify.max_user_watches = 524288
